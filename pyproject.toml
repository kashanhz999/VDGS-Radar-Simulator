[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vdgs-radar-sim"
version = "1.0.0"
description = "Physics-based synthetic FMCW radar data for evaluating visual docking guidance systems"
authors = [{ name = "Kashan Haider" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vdgs_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
